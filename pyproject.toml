[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "particle_twin"
version = "0.1.0"
description = "Bayesian digital twin for turbofan RUL prediction via Sequential Monte Carlo"
authors = [{ name = "Sajjad Ayashmand", email = "s.ayashm@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "notebook"]

[tool.setuptools.packages.find]
where = ["."]
include = ["particle_twin*"]
